name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BINAIRE: declaration-tva

jobs:
  verifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Vérifier que le tag correspond à la version du Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "${version}" ]; then
            echo "::error::Impossible de lire 'version' dans Cargo.toml."
            exit 1
          fi
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::Le tag ${TAG} ne correspond pas à la version du Cargo.toml (attendu : v${version}). Mettez à jour 'version' dans Cargo.toml ou corrigez le tag."
            exit 1
          fi
          echo "Tag ${TAG} conforme à la version ${version} du Cargo.toml."

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Formatage
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  build:
    name: build (${{ matrix.cible }})
    needs: verifications
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            cible: x86_64-unknown-linux-musl
          - os: macos-latest
            cible: aarch64-apple-darwin
          - os: windows-latest
            cible: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Installer musl-tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cible }}

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.cible }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.cible }}

      - name: Archive (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          CIBLE: ${{ matrix.cible }}
        run: |
          set -euo pipefail
          archive="${BINAIRE}-${TAG}-${CIBLE}.tar.gz"
          mkdir -p dist
          cp "target/${CIBLE}/release/${BINAIRE}" README.md dist/
          tar -czf "${archive}" -C dist "${BINAIRE}" README.md
          shasum -a 256 "${archive}" > "${archive}.sha256"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          CIBLE: ${{ matrix.cible }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "$env:BINAIRE-$env:TAG-$env:CIBLE.zip"
          Compress-Archive -Path "target/$env:CIBLE/release/$env:BINAIRE.exe", README.md -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii -NoNewline "$archive.sha256"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.BINAIRE }}-${{ matrix.cible }}
          path: |
            ${{ env.BINAIRE }}-*.tar.gz
            ${{ env.BINAIRE }}-*.zip
            ${{ env.BINAIRE }}-*.sha256
          if-no-files-found: error

  publier:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
